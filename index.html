document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ex:0;opacity:0.08;}\n  .paisley-layer svg{width:100%;height:100%;}\n\n  /* ── Scroll progress (right edge) ── */\n  .progress{position:fixed;top:0;right:0;width:3px;height:100vh;z-index:40;pointer-events:none;}\n  .progress::before{content:'';position:absolute;top:0;right:0;width:1px;height:100%;background:rgba(184,137,43,0.2);}\n  .progress-fill{position:absolute;top:0;right:0;width:3px;background:linear-gradient(to bottom,var(--gold),var(--maroon));height:0%;transition:height 0.1s linear;}\n  .progress-dot{position:absolute;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(245,235,217,0.9),0 0 12px rgba(184,137,43,0.6);}\n\n  /* ── Music toggle ── */\n  .music{position:fixed;top:22px;left:22px;z-index:50;width:44px;height:44px;border-radius:50%;background:rgba(245,235,217,0.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(184,137,43,0.4);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--maroon);box-shadow:0 4px 16px rgba(0,0,0,0.08);}\n  .music svg{width:18px;height:18px;}\n  .music .bars{display:none;gap:2px;align-items:center;height:14px;}\n  .music.playing .bars{display:flex;}\n  .music.playing .play{display:none;}\n  .music .bar{width:2px;background:var(--maroon);border-radius:1px;animation:bars 0.9s ease-in-out infinite;}\n  .music .bar:nth-child(1){animation-delay:-0.9s;}\n  .music .bar:nth-child(2){animation-delay:-0.6s;}\n  .music .bar:nth-child(3){animation-delay:-0.3s;}\n  @keyframes bars{0%,100%{height:4px;}50%{height:14px;}}\n\n  /* ── Sections ── */\n  section{position:relative;padding:80px 24px;z-index:1;}\n\n  /* ── Hero (pinned zoom) ── */\n  .hero{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px;position:sticky;top:0;}\n  .hero-inner{transform-origin:center;will-change:transform,opacity;}\n  .hero .om{font-family:'Tiro Devanagari Marathi',serif;color:var(--maroon);font-size:14px;letter-spacing:0.05em;opacity:0.9;}\n  .hero .kicker{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:0.5em;color:var(--gold);text-transform:uppercase;margin-top:24px;}\n  .hero .sakhar{font-family:'Tiro Devanagari Marathi',serif;color:var(--maroon);font-size:22px;margin-top:10px;letter-spacing:0.08em;}\n  .hero h1{font-family:'Cormorant Garamond',serif;font-weight:500;color:var(--maroon);font-size:64px;line-height:1;margin:36px 0 0;letter-spacing:0.01em;}\n  .hero .amp{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:44px;color:var(--maroon);margin:14px 0;line-height:1;text-shadow:0 1px 0 rgba(184,137,43,0.25);}\n  .hero .devanagari{font-family:'Tiro Devanagari Marathi',serif;font-size:15px;color:var(--ink);opacity:0.65;margin-top:24px;letter-spacing:0.08em;}\n  .hero .date-chip{margin-top:44px;display:inline-flex;align-items:center;gap:16px;padding:14px 22px;border:1px solid rgba(184,137,43,0.5);border-radius:2px;}\n  .hero .date-chip .day{font-size:30px;color:var(--maroon);line-height:1;}\n  .hero .date-chip .meta{text-align:left;font-family:'Inter',sans-serif;font-size:9px;letter-spacing:0.28em;color:var(--ink);opacity:0.7;text-transform:uppercase;line-height:1.6;}\n  .hero .scroll-cue{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);font-family:'Inter',sans-serif;font-size:9px;letter-spacing:0.4em;color:var(--gold);text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:8px;}\n  .hero .scroll-cue .line{width:1px;height:30px;background:linear-gradient(to bottom,var(--gold),transparent);animation:drop 1.8s ease-in-out infinite;}\n  @keyframes drop{0%{transform:scaleY(0);transform-origin:top;}50%{transform:scaleY(1);transform-origin:top;}51%{transform:scaleY(1);transform-origin:bottom;}100%{transform:scaleY(0);transform-origin:bottom;}}\n\n  /* ── Reveal ── */\n  .reveal{opacity:0;transform:translateY(40px);transition:opacity 0.9s cubic-bezier(.2,.7,.2,1),transform 0.9s cubic-bezier(.2,.7,.2,1);}\n  .reveal.in{opacity:1;transform:translateY(0);}\n  .reveal.d1{transition-delay:0.1s;} .reveal.d2{transition-delay:0.22s;} .reveal.d3{transition-delay:0.34s;} .reveal.d4{transition-delay:0.46s;}\n\n  /* ── Section header ── */\n  .section-label{font-family:'Inter',sans-serif;font-size:9px;letter-spacing:0.45em;color:var(--gold);text-transform:uppercase;text-align:center;}\n  .section-title{font-family:'Cormorant Garamond',serif;font-weight:500;color:var(--maroon);font-size:36px;text-align:center;margin:10px 0 6px;letter-spacing:0.01em;}\n  .section-marathi{font-family:'Tiro Devanagari Marathi',serif;font-size:15px;color:var(--ink);opacity:0.6;text-align:center;letter-spacing:0.06em;}\n  .section-divider{display:flex;align-items:center;justify-content:center;margin:22px 0 36px;gap:12px;color:var(--gold);}\n  .section-divider .dash{width:40px;height:1px;background:currentColor;opacity:0.5;}\n  .section-divider .diamond{width:18px;height:18px;background:transparent;transform:none;background-image:url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><g fill='%23B8892B'><circle cx='10' cy='4' r='2.4'/><circle cx='10' cy='16' r='2.4'/><circle cx='4' cy='10' r='2.4'/><circle cx='16' cy='10' r='2.4'/><circle cx='5.8' cy='5.8' r='1.8'/><circle cx='14.2' cy='5.8' r='1.8'/><circle cx='5.8' cy='14.2' r='1.8'/><circle cx='14.2' cy='14.2' r='1.8'/><circle cx='10' cy='10' r='2.2' fill='%237A1E1E'/><\u002Fg><\u002Fsvg>\");background-size:contain;background-repeat:no-repeat;background-position:center;}\n\n  /* ── Event cards ── */\n  .event{background:rgba(255,255,255,0.5);border:1px solid rgba(184,137,43,0.25);padding:28px 24px;margin-bottom:18px;position:relative;overflow:hidden;}\n  .event::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(to right,transparent,var(--gold),transparent);}\n  .event-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}\n  .event-name{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--maroon);line-height:1.1;}\n  .event-marathi{font-family:'Tiro Devanagari Marathi',serif;font-size:12px;color:var(--ink);opacity:0.6;margin-top:4px;}\n  .event-date{text-align:right;font-family:'Inter',sans-serif;font-size:9px;letter-spacing:0.22em;color:var(--gold);text-transform:uppercase;line-height:1.6;}\n  .event-date .big{display:block;font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--maroon);letter-spacing:0.02em;margin-top:2px;}\n  .event-body{margin-top:18px;padding-top:18px;border-top:1px dashed rgba(184,137,43,0.35);display:flex;flex-direction:column;gap:10px;}\n  .event-row{display:flex;gap:12px;font-size:14px;color:var(--ink);opacity:0.85;font-family:'Inter',sans-serif;font-weight:400;}\n  .event-row .k{width:60px;font-size:9px;letter-spacing:0.25em;color:var(--gold);text-transform:uppercase;padding-top:2px;}\n  .event-row .v{flex:1;font-family:'Cormorant Garamond',serif;font-size:16px;}\n  .event-motif{position:absolute;right:-20px;bottom:-20px;opacity:0.08;}\n\n  /* ── Venue / map ── */\n  .map{aspect-ratio:4/3;background:var(--ivory-deep);border:1px solid rgba(184,137,43,0.3);position:relative;overflow:hidden;margin-top:20px;}\n  .map-grid{position:absolute;inset:0;background:\n    linear-gradient(rgba(184,137,43,0.12) 1px,transparent 1px) 0 0/40px 40px,\n    linear-gradient(90deg,rgba(184,137,43,0.12) 1px,transparent 1px) 0 0/40px 40px,\n    linear-gradient(rgba(184,137,43,0.06) 1px,transparent 1px) 0 0/8px 8px,\n    linear-gradient(90deg,rgba(184,137,43,0.06) 1px,transparent 1px) 0 0/8px 8px;}\n  .map-roads{position:absolute;inset:0;}\n  .map-pin{position:absolute;top:50%;left:50%;transform:translate(-50%,-100%);text-align:center;}\n  .map-pin .dot{width:14px;height:14px;border-radius:50%;background:var(--maroon);margin:0 auto;box-shadow:0 0 0 4px rgba(122,30,30,0.18),0 0 0 12px rgba(122,30,30,0.08);animation:pulse 2s ease-in-out infinite;}\n  @keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(122,30,30,0.18),0 0 0 12px rgba(122,30,30,0.08);}50%{box-shadow:0 0 0 6px rgba(122,30,30,0.25),0 0 0 18px rgba(122,30,30,0);}}\n  .map-pin .label{font-family:'Cormorant Garamond',serif;font-size:14px;color:var(--maroon);margin-top:8px;white-space:nowrap;background:var(--ivory);padding:2px 8px;border:1px solid rgba(184,137,43,0.4);}\n  .venue-details{margin-top:22px;font-family:'Cormorant Garamond',serif;text-align:center;}\n  .venue-details .city{font-size:28px;color:var(--maroon);}\n  .venue-details .state{font-size:14px;color:var(--ink);opacity:0.7;font-style:italic;margin-top:4px;}\n  .venue-details .addr{font-family:'Inter',sans-serif;font-size:11px;color:var(--ink);opacity:0.65;letter-spacing:0.08em;margin-top:14px;line-height:1.7;}\n  .venue-btn{display:inline-block;margin-top:20px;padding:12px 24px;background:var(--maroon);color:var(--ivory);text-decoration:none;font-family:'Inter',sans-serif;font-size:10px;letter-spacing:0.3em;text-transform:uppercase;border:1px solid var(--maroon);}\n\n  /* ── Footer ── */\n  footer{padding:60px 24px 80px;text-align:center;position:relative;}\n\n  /* Countdown */\n  .countdown{padding:80px 24px 60px;text-align:center;position:relative;}\n  .cd-grid{display:flex;justify-content:center;align-items:flex-start;gap:0;max-width:440px;margin:30px auto 0;border-top:1px solid rgba(184,137,43,0.4);border-bottom:1px solid rgba(184,137,43,0.4);padding:22px 0;}\n  .cd-cell{flex:1;text-align:center;padding:0 6px;position:relative;}\n  .cd-cell + .cd-cell::before{content:'';position:absolute;left:0;top:10%;bottom:10%;width:1px;background:rgba(184,137,43,0.35);}\n  .cd-num{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:46px;color:var(--maroon);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:0.02em;}\n  .cd-lbl{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;letter-spacing:0.18em;color:var(--gold);text-transform:lowercase;margin-top:8px;}\n  .cd-when{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--ink);opacity:0.7;font-size:14px;margin-top:24px;letter-spacing:0.04em;}\n  .cd-when .bold{font-family:'Cormorant Garamond',serif;font-style:normal;color:var(--maroon);font-size:20px;letter-spacing:0.06em;display:block;margin-top:6px;}\n  .cd-ended{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--maroon);font-size:22px;margin-top:10px;}\n  footer .with{font-family:'Inter',sans-serif;font-size:9px;letter-spacing:0.4em;color:var(--gold);text-transform:uppercase;}\n  footer .family{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--maroon);margin-top:14px;letter-spacing:0.04em;}\n  footer .family-marathi{font-family:'Tiro Devanagari Marathi',serif;font-size:13px;color:var(--ink);opacity:0.65;margin-top:4px;}\n  footer .blessing{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:var(--ink);opacity:0.65;margin-top:32px;line-height:1.7;}\n\n  /* ── Marigold petals (falling) ── */\n  .petals{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden;}\n  .petal{position:absolute;top:-40px;width:22px;height:22px;opacity:0;animation:petal-fall linear infinite;will-change:transform,opacity;}\n  .petal svg{width:100%;height:100%;display:block;}\n  @keyframes petal-fall{\n    0%{transform:translateY(-5vh) translateX(0) rotate(0deg);opacity:0;}\n    8%{opacity:0.9;}\n    50%{transform:translateY(55vh) translateX(40px) rotate(220deg);opacity:0.9;}\n    92%{opacity:0.8;}\n    100%{transform:translateY(110vh) translateX(-30px) rotate(520deg);opacity:0;}\n  }\n\n  /* ── Gold glitter sparkles ── */\n  .glitter{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden;}\n  .spark{position:absolute;width:6px;height:6px;opacity:0;animation:twinkle ease-in-out infinite;}\n  .spark::before,.spark::after{content:'';position:absolute;background:#D4A94A;border-radius:1px;}\n  .spark::before{left:50%;top:0;width:1px;height:100%;transform:translateX(-50%);box-shadow:0 0 4px #D4A94A;}\n  .spark::after{top:50%;left:0;height:1px;width:100%;transform:translateY(-50%);box-shadow:0 0 4px #D4A94A;}\n  @keyframes twinkle{\n    0%,100%{opacity:0;transform:scale(0.4) rotate(0deg);}\n    50%{opacity:0.9;transform:scale(1.1) rotate(45deg);}\n  }\n\n  /* ── Floral divider accent ── */\n  .floral-accent{display:inline-block;vertical-align:middle;margin:0 4px;}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- Gold glitter sparkles (behind content) -->\n<div class=\"glitter\" aria-hidden=\"true\">\n  <div class=\"spark\" style=\"top:8%;left:12%;animation-duration:3.2s;animation-delay:0s;\"><\u002Fdiv>\n  <div class=\"spark\" style=\"top:18%;left:82%;animation-duration:2.6s;animation-delay:0.7s;\"><\u002Fdiv>\n  <div class=\"spark\" style=\"top:32%;left:28%;animation-duration:3.6s;animation-delay:1.4s;\"><\u002Fdiv>\n  <div class=\"spark\" style=\"top:46%;left:72%;animation-duration:2.8s;animation-delay:0.4s;\"><\u002Fdiv>\n  <div class=\"spark\" style=\"top:58%;left:8%;animation-duration:3.1s;animation-delay:1.8s;\"><\u002Fdiv>\n  <div class=\"spark\" style=\"top:64%;left:92%;animation-duration:2.4s;animation-delay:0.9s;\"><\u002Fdiv>\n  <div class=\"spark\" style=\"top:74%;left:40%;animation-duration:3.4s;animation-delay:2.1s;\"><\u002Fdiv>\n  <div class=\"spark\" style=\"top:88%;left:62%;animation-duration:2.9s;animation-delay:1.2s;\"><\u002Fdiv>\n  <div class=\"spark\" style=\"top:22%;left:54%;animation-duration:3.3s;animation-delay:2.5s;\"><\u002Fdiv>\n  <div class=\"spark\" style=\"top:92%;left:22%;animation-duration:2.7s;animation-delay:0.2s;\"><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Marigold petals -->\n<div class=\"petals\" aria-hidden=\"true\" id=\"petals\">\n  <!-- petals injected by JS -->\n<\u002Fdiv>\n\n<!-- Parallax paisley layers -->\n<div class=\"paisley-layer\" data-speed=\"0.1\" style=\"top:-5%;left:-10%;width:60%;height:60%;\">\n  <svg viewBox=\"0 0 200 200\">\n    <path d=\"M 60 140 Q 30 100 70 60 Q 120 30 150 70 Q 160 120 120 140 Q 90 150 60 140 Z\" fill=\"none\" stroke=\"#B8892B\" stroke-width=\"1.5\"><\u002Fpath>\n    <circle cx=\"100\" cy=\"100\" r=\"6\" fill=\"#B8892B\"><\u002Fcircle>\n    <path d=\"M 80 120 Q 70 100 90 90 Q 110 85 115 105 Q 108 120 95 120 Z\" fill=\"none\" stroke=\"#B8892B\" stroke-width=\"1\"><\u002Fpath>\n  <\u002Fsvg>\n<\u002Fdiv>\n<div class=\"paisley-layer\" data-speed=\"0.2\" style=\"top:40%;right:-15%;width:70%;height:70%;transform:scaleX(-1);\">\n  <svg viewBox=\"0 0 200 200\">\n    <path d=\"M 60 140 Q 30 100 70 60 Q 120 30 150 70 Q 160 120 120 140 Q 90 150 60 140 Z\" fill=\"none\" stroke=\"#7A1E1E\" stroke-width=\"1.5\"><\u002Fpath>\n    <circle cx=\"100\" cy=\"100\" r=\"6\" fill=\"#7A1E1E\"><\u002Fcircle>\n  <\u002Fsvg>\n<\u002Fdiv>\n<div class=\"paisley-layer\" data-speed=\"0.15\" style=\"top:120%;left:-5%;width:50%;height:50%;\">\n  <svg viewBox=\"0 0 200 200\">\n    <circle cx=\"100\" cy=\"100\" r=\"80\" fill=\"none\" stroke=\"#B8892B\" stroke-width=\"1\"><\u002Fcircle>\n    <circle cx=\"100\" cy=\"100\" r=\"60\" fill=\"none\" stroke=\"#B8892B\" stroke-width=\"0.6\"><\u002Fcircle>\n    <path d=\"M 100 30 L 104 95 L 170 100 L 104 104 L 100 170 L 96 104 L 30 100 L 96 96 Z\" fill=\"#B8892B\"><\u002Fpath>\n  <\u002Fsvg>\n<\u002Fdiv>\n\n<!-- Scroll progress -->\n<div class=\"progress\">\n  <div class=\"progress-fill\" id=\"progFill\"><\u002Fdiv>\n  <div class=\"progress-dot\" id=\"progDot\" style=\"top:0;\"><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Music toggle -->\n<button class=\"music\" id=\"musicBtn\" aria-label=\"Toggle music\">\n  <svg class=\"play\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M9 6 L9 18 L8 18 L8 6 Z M13 6 L13 18 L12 18 L12 6 Z\"><\u002Fpath><path d=\"M7 5 h3 v14 h-3 z M14 5 h3 v14 h-3 z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"><\u002Fpath><path d=\"M9 5 L20 12 L9 19 Z\" opacity=\"0\"><\u002Fpath><\u002Fsvg>\n  <svg class=\"play\" viewBox=\"0 0 24 24\" style=\"displ e=\"margin-bottom:50px;\">\n    <div class=\"city\">Darwha<\u002Fdiv>\n    <div class=\"state\">Maharashtra, India<\u002Fdiv>\n    <div class=\"addr\">Kavita Mangal Karyalay<br>Darwha Bypass, Darwha 445202<\u002Fdiv>\n    <a class=\"venue-btn\" href=\"https://maps.google.com/?q=Kavita+Mangal+Karyalay+Darwha+Bypass+Darwha+Maharashtra+445202\" target=\"_blank\" rel=\"noopener\">Open in Maps →<\u002Fa>\n  <\u002Fdiv>\n\n  <!-- Venue 2: Reception -->\n  <div class=\"reveal d1\" style=\"margin:20px 0 14px;text-align:center;\">\n    <div style=\"font-family:'Inter',sans-serif;font-size:9px;letter-spacing:0.35em;color:var(--gold);text-transform:uppercase;\">Venue 02 · Reception<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"reveal d1 map\">\n    <div class=\"map-grid\"><\u002Fdiv>\n    <svg class=\"map-roads\" viewBox=\"0 0 400 300\" preserveAspectRatio=\"none\">\n      <path d=\"M 0 180 Q 120 160 220 180 T 400 170\" fill=\"none\" stroke=\"#7A1E1E\" stroke-width=\"3\" opacity=\"0.35\"><\u002Fpath>\n      <path d=\"M 150 0 L 150 300\" stroke=\"#7A1E1E\" stroke-width=\"2\" opacity=\"0.25\"><\u002Fpath>\n      <path d=\"M 0 60 L 400 70\" stroke=\"#B8892B\" stroke-width=\"1.5\" opacity=\"0.3\"><\u002Fpath>\n      <path d=\"M 0 240 L 400 250\" stroke=\"#B8892B\" stroke-width=\"1.5\" opacity=\"0.3\"><\u002Fpath>\n      <path d=\"M 300 0 Q 310 150 320 300\" fill=\"none\" stroke=\"#B8892B\" stroke-width=\"1\" opacity=\"0.3\"><\u002Fpath>\n    <\u002Fsvg>\n    <div class=\"map-pin\">\n      <div class=\"dot\"><\u002Fdiv>\n      <div class=\"label\">MD Lawn<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"reveal d2 venue-details\">\n    <div class=\"city\">Digras<\u002Fdiv>\n    <div class=\"state\">Maharashtra, India<\u002Fdiv>\n    <div class=\"addr\">MD Lawn<br>Samta Nagar, Manora Road, Digras 445203<\u002Fdiv>\n    <a class=\"venue-btn\" href=\"https://maps.google.com/?q=MD+Lawn+Samta+Nagar+Manora+Road+Digras+Maharashtra+445203\" target=\"_blank\" rel=\"noopener\">Open in Maps →<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ COUNTDOWN ═══ -->\n<section class=\"countdown\">\n  <div class=\"reveal\">\n    <div class=\"section-label\">Save the Date<\u002Fdiv>\n    <h2 class=\"section-title\">Counting the Days<\u002Fh2>\n    <div class=\"section-marathi\">मंगल दिनाची प्रतीक्षा<\u002Fdiv>\n    <div class=\"section-divider\"><div class=\"dash\"><\u002Fdiv><div class=\"diamond\"><\u002Fdiv><div class=\"dash\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"reveal d1\">\n    <div class=\"cd-grid\" id=\"cdGrid\">\n      <div class=\"cd-cell\"><div class=\"cd-num\" id=\"cdDays\">——<\u002Fdiv><div class=\"cd-lbl\">Days<\u002Fdiv><\u002Fdiv>\n      <div class=\"cd-cell\"><div class=\"cd-num\" id=\"cdHours\">——<\u002Fdiv><div class=\"cd-lbl\">Hours<\u002Fdiv><\u002Fdiv>\n      <div class=\"cd-cell\"><div class=\"cd-num\" id=\"cdMins\">——<\u002Fdiv><div class=\"cd-lbl\">Mins<\u002Fdiv><\u002Fdiv>\n      <div class=\"cd-cell\"><div class=\"cd-num\" id=\"cdSecs\">——<\u002Fdiv><div class=\"cd-lbl\">Secs<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"cd-when\">until the wedding on<span class=\"bold\">07 May 2026 · 12:35 PM<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ FOOTER ═══ -->\n<footer>\n  <div class=\"reveal\">\n    <svg width=\"120\" height=\"20\" viewBox=\"0 0 120 20\" style=\"margin:0 auto 20px;display:block;\">\n      <path d=\"M 0 10 L 45 10\" stroke=\"#B8892B\" stroke-width=\"0.8\"><\u002Fpath>\n      <path d=\"M 75 10 L 120 10\" stroke=\"#B8892B\" stroke-width=\"0.8\"><\u002Fpath>\n      <path d=\"M 60 4 L 66 10 L 60 16 L 54 10 Z\" fill=\"#B8892B\"><\u002Fpath>\n    <\u002Fsvg>\n    <div class=\"blessing\">॥ शुभम् भवतु ॥<br>May this moment be blessed.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  // Generate marigold petals\n  (function makePetals(){\n    const host = document.getElementById('petals');\n    if (!host) return;\n    const PETAL_SVG = `\n      <svg viewBox=\"0 0 40 40\">\n        <g>\n          <ellipse cx=\"20\" cy=\"14\" rx=\"7\" ry=\"9\" fill=\"#E8892E\"/>\n          <ellipse cx=\"26\" cy=\"22\" rx=\"7\" ry=\"9\" fill=\"#F2A83D\" transform=\"rotate(60 26 22)\"/>\n          <ellipse cx=\"14\" cy=\"22\" rx=\"7\" ry=\"9\" fill=\"#C96A1F\" transform=\"rotate(-60 14 22)\"/>\n          <ellipse cx=\"20\" cy=\"26\" rx=\"7\" ry=\"9\" fill=\"#E8892E\" transform=\"rotate(180 20 26)\"/>\n          <circle cx=\"20\" cy=\"20\" r=\"3.5\" fill=\"#7A1E1E\" opacity=\"0.7\"/>\n        <\u002Fg>\n      <\u002Fsvg>`;\n    const PETAL_SIMPLE = `\n      <svg viewBox=\"0 0 40 40\">\n        <path d=\"M 20 6 Q 28 14 28 22 Q 24 30 20 34 Q 16 30 12 22 Q 12 14 20 6 Z\" fill=\"#D97A2A\"/>\n        <path d=\"M 20 10 Q 25 16 25 22 Q 22 28 20 30 Q 18 28 15 22 Q 15 16 20 10 Z\" fill=\"#F2A83D\" opacity=\"0.7\"/>\n      <\u002Fsvg>`;\n    const COUNT = 14;\n    for (let i = 0; i < COUNT; i++){\n      const p = document.createElement('div');\n      p.className = 'petal';\n      p.style.left = (Math.random() * 100) + '%';\n      const size = 14 + Math.random() * 18;\n      p.style.width = p.style.height = size + 'px';\n      p.style.animationDuration = (9 + Math.random() * 10) + 's';\n      p.style.animationDelay = (Math.random() * -18) + 's';\n      p.style.opacity = (0.7 + Math.random() * 0.3).toString();\n      p.innerHTML = i % 2 === 0 ? PETAL_SVG : PETAL_SIMPLE;\n      host.appendChild(p);\n    }\n  })();\n\n  // Parallax for paisley layers\n  const layers = document.querySelectorAll('.paisley-layer');\n  const progFill = document.getElementById('progFill');\n  const progDot = document.getElementById('progDot');\n  const heroInner = document.getElementById('heroInner');\n\n  function onScroll(){\n    const scroller = document.scrollingElement || document.documentElement;\n    const y = scroller.scrollTop;\n    const max = scroller.scrollHeight - scroller.clientHeight;\n    const p = max > 0 ? Math.min(1, y / max) : 0;\n\n    // Parallax\n    layers.forEach(l => {\n      const s = parseFloat(l.dataset.speed || '0.1');\n      l.style.transform = (l.style.transform.includes('scaleX(-1)') ? 'scaleX(-1) ' : '') + `translateY(${-y * s}px)`;\n    });\n\n    // Hero zoom + fade\n    const vh = window.innerHeight;\n    const hp = Math.min(1, y / vh);\n    if (heroInner){\n      heroInner.style.transform = `scale(${1 + hp * 0.25})`;\n      heroInner.style.opacity = String(Math.max(0, 1 - hp * 1.2));\n    }\n\n    // Progress\n    progFill.style.height = (p * 100) + '%';\n    progDot.style.top = 'calc(' + (p * 100) + '% - 4px)';\n  }\n\n  document.addEventListener('scroll', onScroll, {passive:true});\n  onScroll();\n\n  // Reveal on intersect\n  const io = new IntersectionObserver((entries) => {\n    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });\n  }, {threshold: 0.15});\n  document.querySelectorAll('.reveal').forEach(el => io.observe(el));\n\n  // Music toggle — Web Audio synthesized tanpura drone as default.\n  // ─────────────────────────────────────────────\n  // 🎵 TO USE YOUR OWN MUSIC: set MUSIC_URL below to the path or URL of an audio file.\n  //    Examples:\n  //      const MUSIC_URL = 'music.mp3';                    // file next to this HTML\n  //      const MUSIC_URL = 'https://example.com/song.mp3'; // remote URL\n  //    Leave as null (default) for the built-in synthesized drone.\n  const MUSIC_URL = 'music.mp3';\n  // ─────────────────────────────────────────────\n  const musicBtn = document.getElementById('musicBtn');\n  let audioCtx = null, synthNodes = null, htmlAudio = null, isPlaying = false;\n\n  function startSynth(){\n    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();\n    const ctx = audioCtx;\n    const master = ctx.createGain();\n    master.gain.value = 0;\n    master.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 1.2);\n    master.connect(ctx.destination);\n    // Tanpura-like drone: Sa (C3 130.8) + Pa (G3 196) + Sa octave (C4 261.6)\n    const freqs = [130.81, 196.00, 261.63, 130.81];\n    const oscs = [], gains = [];\n    freqs.forEach((f, i) => {\n      const o1 = ctx.createOscillator(); o1.type = 'triangle'; o1.frequency.value = f;\n      const o2 = ctx.createOscillator(); o2.type = 'sine';     o2.frequency.value = f * 2;\n      const g  = ctx.createGain(); g.gain.value = 0;\n      const filt = ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 900;\n      o1.connect(filt); o2.connect(filt); filt.connect(g); g.connect(master);\n      o1.start(); o2.start();\n      oscs.push(o1, o2); gains.push(g);\n    });\n    // Cycle through strings every 2s (tanpura-like)\n    let idx = 0;\n    const tick = () => {\n      if (!synthNodes) return;\n      const now = audioCtx.currentTime;\n      const g = gains[idx % gains.length];\n      g.gain.cancelScheduledValues(now);\n      g.gain.setValueAtTime(g.gain.value, now);\n      g.gain.linearRampToValueAtTime(0.55, now + 0.08);\n      g.gain.exponentialRampToValueAtTime(0.01, now + 2.2);\n      idx++;\n    };\n    tick();\n    const interval = setInterval(tick, 1600);\n    synthNodes = { master, oscs, gains, interval };\n  }\n  function stopSynth(){\n    if (!synthNodes || !audioCtx) return;\n    const ctx = audioCtx;\n    synthNodes.master.gain.cancelScheduledValues(ctx.currentTime);\n    synthNodes.master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);\n    clearInterval(synthNodes.interval);\n    const nodes = synthNodes; synthNodes = null;\n    setTimeout(() => { nodes.oscs.forEach(o => { try { o.stop(); } catch(e){} }); }, 500);\n  }\n\n  function play(){\n    if (MUSIC_URL){\n      if (!htmlAudio){\n        htmlAudio = new Audio(MUSIC_URL);\n        htmlAudio.loop = true;\n        htmlAudio.volume = 0.6;\n      }\n      htmlAudio.play().then(() => { isPlaying = true; musicBtn.classList.add('playing'); }).catch(() => {});\n    } else {\n      startSynth();\n      isPlaying = true;\n      musicBtn.classList.add('playing');\n    }\n  }\n  function stop(){\n    if (htmlAudio){ htmlAudio.pause(); }\n    stopSynth();\n    isPlaying = false;\n    musicBtn.classList.remove('playing');\n  }\n  musicBtn.addEventListener('click', () => { isPlaying ? stop() : play(); });\n  // Seek to 7s once metadata loads, then click the play button when audio is ready\n  if (!htmlAudio){ htmlAudio = new Audio(MUSIC_URL); htmlAudio.loop = true; htmlAudio.volume = 0.6; }\n  htmlAudio.addEventListener('loadedmetadata', function(){ htmlAudio.currentTime = 7; }, { once: true });\n  htmlAudio.addEventListener('canplaythrough', function(){\n    if (!isPlaying) musicBtn.click();\n  }, { once: true });\n\n  // Countdown to 07 May 2026 11:00 AM IST (UTC+5:30)\n  const target = new Date('2026-05-07T12:35:00+05:30').getTime();\n  const pad = n => String(n).padStart(2,'0');\n  const cdDays = document.getElementById('cdDays');\n  const cdHours = document.getElementById('cdHours');\n  const cdMins = document.getElementById('cdMins');\n  const cdSecs = document.getElementById('cdSecs');\n  const cdGrid = document.getElementById('cdGrid');\n  function tick(){\n    const now = Date.now();\n    let diff = target - now;\n    if (diff <= 0){\n      cdGrid.innerHTML = '<div class=\"cd-ended\" style=\"grid-column:1/-1;\">शुभ विवाह · The day is here.<\u002Fdiv>';\n      return;\n    }\n    const d = Math.floor(diff / 86400000); diff -= d * 86400000;\n    const h = Math.floor(diff / 3600000);  diff -= h * 3600000;\n    const m = Math.floor(diff / 60000);    diff -= m * 60000;\n    const s = Math.floor(diff / 1000);\n    cdDays.textContent = pad(d);\n    cdHours.textContent = pad(h);\n    cdMins.textContent = pad(m);\n    cdSecs.textContent = pad(s);\n  }\n  tick(); setInterval(tick, 1000);\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
